name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Kinera package and test dependencies
        run: python -m pip install -e .[test]

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v
          pytest tests/test_phase46_metrics.py tests/test_regime1_identifiability.py -v
