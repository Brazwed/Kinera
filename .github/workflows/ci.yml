name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Kinera package and test dependencies
        run: python -m pip install -e .[test]

      - name: Run regression suite
        # Keep deterministic bounded checks from the pilot module; skip only
        # profiling, full/multi-unit pilot execution, and benchmark entry points.
        run: |
          python -m pytest -q tests \
            --deselect=tests/test_expanded_replay_pilot.py::ExpandedPilotExecutionTests::test_cost_profile_and_resource_tracking \
            --deselect=tests/test_expanded_replay_pilot.py::ExpandedPilotExecutionTests::test_full_expanded_pilot_execution_and_schema \
            --deselect=tests/test_expanded_replay_pilot.py::ExpandedPilotExecutionTests::test_incremental_checkpoint_and_resume_after_failure_and_seed_expansion \
            --deselect=tests/test_expanded_replay_pilot.py::ExpandedPilotExecutionTests::test_cpu_vs_cuda_microbenchmark_separates_init_and_verifies_parity \
            --deselect=tests/test_expanded_replay_pilot.py::ExpandedPilotExecutionTests::test_cli_runner_seeds_resume_and_verification
